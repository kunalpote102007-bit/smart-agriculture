<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Login | Smart Agriculture Platform</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f8f5;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    border:1px solid #e1ebe4;
    border-radius:18px;
    padding:34px;
    box-shadow:0 12px 35px rgba(25,70,42,.08);
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo-icon{
    width:55px;
    height:55px;
    margin:0 auto 12px;
    border-radius:14px;
    background:#eaf5ed;
    color:#287b49;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.logo h1{
    color:#183b27;
    font-size:22px;
}

.logo p{
    color:#87938c;
    font-size:10px;
    margin-top:5px;
}

.title{
    margin-bottom:20px;
}

.title h2{
    color:#26382d;
    font-size:18px;
}

.title p{
    color:#8a968e;
    font-size:9px;
    margin-top:5px;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    color:#526158;
    font-size:9px;
    font-weight:bold;
    margin-bottom:6px;
}

.input{
    position:relative;
}

.input i{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#398355;
    font-size:10px;
}

.input input{
    width:100%;
    height:43px;
    border:1px solid #dce6df;
    border-radius:8px;
    background:#fbfdfb;
    outline:none;
    padding:0 12px 0 34px;
    font-size:10px;
    color:#26382d;
}

.input input:focus{
    border-color:#398355;
    background:white;
    box-shadow:0 0 0 3px rgba(57,131,85,.07);
}

.login-btn{
    width:100%;
    height:43px;
    margin-top:5px;
    border:0;
    border-radius:8px;
    background:#287b49;
    color:white;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#1d6339;
}

.register-link{
    text-align:center;
    margin-top:19px;
    color:#87938c;
    font-size:9px;
}

.register-link a{
    color:#287b49;
    text-decoration:none;
    font-weight:bold;
}

.register-link a:hover{
    text-decoration:underline;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#65736a;
    text-decoration:none;
    font-size:9px;
}

.back a:hover{
    color:#287b49;
}

@media(max-width:480px){

    .login-box{
        padding:27px 21px;
    }

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<div class="logo-icon">

<i class="fa-solid fa-seedling"></i>

</div>

<h1>Smart Agriculture</h1>

<p>Smart Agriculture Platform</p>

</div>


<div class="title">

<h2>Welcome Back</h2>

<p>Login to access your farmer dashboard.</p>

</div>


<div class="field">

<label>Email Address</label>

<div class="input">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
autocomplete="email">

</div>

</div>


<div class="field">

<label>Password</label>

<div class="input">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
autocomplete="current-password">

</div>

</div>


<button
class="login-btn"
onclick="login()">

<i class="fa-solid fa-right-to-bracket"></i>
 Login

</button>


<div class="register-link">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>


<div class="back">

<a href="index.html">
<i class="fa-solid fa-arrow-left"></i>
 Back to Home
</a>

</div>

</div>


<script src="auth.js"></script>

</body>

</html>
