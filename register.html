<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Registration | Smart Agriculture Platform</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f8f5;
    padding:25px;
}

.register-box{
    width:100%;
    max-width:440px;
    background:white;
    border:1px solid #e1ebe4;
    border-radius:18px;
    padding:32px;
    box-shadow:0 12px 35px rgba(25,70,42,.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:52px;
    height:52px;
    margin:0 auto 12px;
    border-radius:14px;
    background:#eaf5ed;
    color:#287b49;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:23px;
}

.logo h1{
    color:#183b27;
    font-size:22px;
}

.logo p{
    color:#87938c;
    font-size:10px;
    margin-top:5px;
}

.title{
    margin-bottom:20px;
}

.title h2{
    color:#26382d;
    font-size:17px;
}

.title p{
    color:#8a968e;
    font-size:9px;
    margin-top:5px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:#526158;
    font-size:9px;
    font-weight:bold;
    margin-bottom:6px;
}

.input{
    position:relative;
}

.input i{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#398355;
    font-size:10px;
}

.input input{
    width:100%;
    height:42px;
    border:1px solid #dce6df;
    border-radius:8px;
    background:#fbfdfb;
    outline:none;
    padding:0 12px 0 34px;
    font-size:10px;
    color:#26382d;
}

.input input:focus{
    border-color:#398355;
    background:white;
    box-shadow:0 0 0 3px rgba(57,131,85,.07);
}

.register-btn{
    width:100%;
    height:42px;
    margin-top:7px;
    border:0;
    border-radius:8px;
    background:#287b49;
    color:white;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.register-btn:hover{
    background:#1d6339;
}

.login-link{
    text-align:center;
    margin-top:18px;
    font-size:9px;
    color:#87938c;
}

.login-link a{
    color:#287b49;
    text-decoration:none;
    font-weight:bold;
}

.login-link a:hover{
    text-decoration:underline;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#65736a;
    text-decoration:none;
    font-size:9px;
}

.back a:hover{
    color:#287b49;
}

@media(max-width:480px){

    .register-box{
        padding:25px 20px;
    }

}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">

<div class="logo-icon">
<i class="fa-solid fa-seedling"></i>
</div>

<h1>Smart Agriculture</h1>

<p>Smart Agriculture Platform</p>

</div>

<div class="title">

<h2>Create Farmer Account</h2>

<p>Register to access your agriculture dashboard.</p>

</div>

<div class="field">

<label>Full Name</label>

<div class="input">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="Enter your full name"
autocomplete="name">

</div>

</div>

<div class="field">

<label>Mobile Number</label>

<div class="input">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
id="mobile"
placeholder="Enter mobile number"
maxlength="10"
autocomplete="tel">

</div>

</div>

<div class="field">

<label>Email Address</label>

<div class="input">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter email address"
autocomplete="email">

</div>

</div>

<div class="field">

<label>Address</label>

<div class="input">

<i class="fa-solid fa-location-dot"></i>

<input
type="text"
id="address"
placeholder="Enter your address"
autocomplete="street-address">

</div>

</div>

<div class="field">

<label>Password</label>

<div class="input">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Create password"
autocomplete="new-password">

</div>

</div>

<button
type="button"
class="register-btn"
onclick="register()">

<i class="fa-solid fa-user-plus"></i>
Create Account

</button>

<div class="login-link">

Already have an account?

<a href="login.html">
Login
</a>

</div>

<div class="back">

<a href="index.html">
<i class="fa-solid fa-arrow-left"></i>
Back to Home
</a>

</div>

</div>

<script src="auth.js"></script>

</body>

</html>
